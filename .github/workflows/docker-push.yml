name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    if: github.repository == 'HeeralalGupta/UYPYOG-Migration-Frameworks'
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tag
        id: version
        run: echo "tag=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./FinanceDataMigration
          file: ./FinanceDataMigration/Dockerfile
          push: true
          
          build-args: |
               APP_VERSION=${{ steps.version.outputs.tag }}
               
          tags: |
            heeralalgupta/finance-data-migration:latest
            heeralalgupta/finance-data-migration:${{ steps.version.outputs.tag }}
