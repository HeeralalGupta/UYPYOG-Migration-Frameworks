# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Hibernate Logging
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000


# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never


# Migration Executor
migration.executor.core-pool-size=6
migration.executor.max-pool-size=6
migration.executor.queue-capacity=13
migration.executor.thread-name-prefix=migration-
migration.executor.wait-for-tasks-to-complete=true
migration.executor.await-termination-seconds=60

# Migration WebSocket progress logging
logging.level.MIGRATION_PROGRESS=${MIGRATION_PROGRESS_LOG_LEVEL:OFF}
